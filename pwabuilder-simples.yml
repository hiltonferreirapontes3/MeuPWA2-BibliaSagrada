name: Gerar APK AAB - PWABuilder Simples

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar PWABuilder CLI
        run: npm install -g @pwabuilder/cli

      - name: Gerar Android package
        run: |
          mkdir output
          npx pwabuilder https://hiltonferreirapontes3.github.io/MeuPWA-BibliaSagrada/ -p android --directory ./output --verbose
          ls -R ./output

      - name: Upload resultado
        uses: actions/upload-artifact@v4
        with:
          name: PWABuilder-Android-Package
          path: output
